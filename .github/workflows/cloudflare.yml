name: Deploy Bakiye to Cloudflare
on:
  push:
    branches: [main]
    paths: ["index.html","data/**","worker/**","wrangler.jsonc",".github/workflows/**"]
  workflow_dispatch:

jobs:
  deploy:
    concurrency:
      group: bakiye-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm existing R2 bucket
        run: echo "Using existing R2 bucket bakiye-data; no create operation needed."

      - name: Seed data if R2 is empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/quotes.json --remote >/dev/null 2>&1 || npx wrangler@latest r2 object put bakiye-data/quotes.json --file=data/quotes.json --content-type=application/json --remote
          npx wrangler@latest r2 object get bakiye-data/tlref.json --file=/tmp/tlref.json --remote >/dev/null 2>&1 || npx wrangler@latest r2 object put bakiye-data/tlref.json --file=data/tlref.json --content-type=application/json --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy

      - name: Publish 30-day stock closing archive seed
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f data/history/stock-closing.json ]; then
            npx wrangler@latest r2 object put bakiye-data/history/stock-closing.json --file=data/history/stock-closing.json --content-type=application/json --remote
          fi

      - name: Publish history seed if changed
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "data/history.json"; then
            npx wrangler@latest r2 object put bakiye-data/history.json --file=data/history.json --content-type=application/json --remote
          else
            echo "history.json unchanged; preserving live R2 archive"
          fi

      - name: Publish canonical TLREF and real costs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/balance.json --file=data/balance.json --content-type=application/json --remote
          npx wrangler@latest r2 object put bakiye-data/tlref.json --file=data/tlref.json --content-type=application/json --remote
          npx wrangler@latest r2 object put bakiye-data/positions.json --file=data/positions.json --content-type=application/json --remote
