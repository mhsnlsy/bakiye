name: Deploy Bakiye to Cloudflare
on:
  push:
    branches: [main]
    paths: ["index.html","data/**","worker/**","wrangler.jsonc",".github/workflows/cloudflare.yml"]
  workflow_dispatch:
concurrency:
  group: bakiye-cloudflare
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Create R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest r2 bucket create bakiye-data || true
      - name: Seed data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/quotes.json --file=data/quotes.json --content-type=application/json
          npx wrangler@latest r2 object put bakiye-data/tlref.json --file=data/tlref.json --content-type=application/json
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy