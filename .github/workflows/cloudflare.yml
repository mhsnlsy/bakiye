name: Deploy Bakiye to Cloudflare
on:
  push:
    branches: [main]
    paths: ["index.html","data/**","worker/**","wrangler.jsonc",".github/workflows/**","scripts/**"]
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

jobs:
  deploy:
    concurrency:
      group: bakiye-deploy
      cancel-in-progress: true
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Confirm existing R2 bucket
        run: echo "Using existing R2 bucket bakiye-data; no create operation needed."
      - name: Seed data if R2 is empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/quotes.json --remote >/dev/null 2>&1 || npx wrangler@latest r2 object put bakiye-data/quotes.json --file=data/quotes.json --content-type=application/json --remote
          npx wrangler@latest r2 object get bakiye-data/tlref.json --file=/tmp/tlref.json --remote >/dev/null 2>&1 || npx wrangler@latest r2 object put bakiye-data/tlref.json --file=data/tlref.json --content-type=application/json --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy
      - name: Publish 30-day stock closing archive seed
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -f data/history/stock-closing.json ]; then
            npx wrangler@latest r2 object put bakiye-data/history/stock-closing.json --file=data/history/stock-closing.json --content-type=application/json --remote
          fi

      - name: Publish history seed if changed
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "data/history.json"; then
            npx wrangler@latest r2 object put bakiye-data/history.json --file=data/history.json --content-type=application/json --remote
          else
            echo "history.json unchanged; preserving live R2 archive"
          fi

      - name: Publish canonical TLREF and real costs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/tlref.json --file=data/tlref.json --content-type=application/json --remote
          npx wrangler@latest r2 object put bakiye-data/positions.json --file=data/positions.json --content-type=application/json --remote

  refresh-quotes:
    concurrency:
      group: bakiye-live-quotes
      cancel-in-progress: false
    needs: deploy
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Read current quotes from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/quotes.json --remote || cp data/quotes.json /tmp/quotes.json
      - name: Validate quote refresh script
        run: python3 -m py_compile scripts/refresh_quotes.py

      - name: Fetch fresh OYAK prices
        run: python3 scripts/refresh_quotes.py
      - name: Write fresh quotes to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/quotes.json --file=/tmp/quotes.json --content-type=application/json --remote
      - name: Verify fresh quotes in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/verify-quotes.json --remote
          python3 - <<'PY'
          import json
          q=json.load(open("/tmp/verify-quotes.json"))
          print("R2 lastRefresh:", q.get("lastRefresh"))
          print("R2 quotes:", q.get("quotes"))
          print("R2 FX:", q.get("fx"))
          print("R2 errors:", q.get("errors"))
          assert not q.get("errors"), q.get("errors")
          assert all(isinstance(q.get("quotes", {}).get(k), (int, float)) and q["quotes"][k] > 0 for k in ["TAVHL","KARSN","THYAO","CGCAM","SISE","ZPLIB.F"])
          assert all(isinstance(q.get("fx", {}).get(k), (int, float)) and q["fx"][k] > 0 for k in ["USDTRY","EURTRY","GBPTRY"])
          from datetime import datetime, timezone, timedelta
          refreshed=datetime.fromisoformat(q["lastRefresh"].replace("Z","+00:00"))
          assert datetime.now(timezone.utc)-refreshed < timedelta(minutes=3), "R2 quote data is not fresh"
          PY
      - name: Verify public Worker quote API
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          with open("/tmp/verify-quotes.json", encoding="utf-8") as f:
              expected=json.load(f)
          urls=[
            "https://bakiye.muhsin-ulusoy.workers.dev/api/quotes?verify="+str(time.time_ns()),
            "https://bakiye.muhsin-ulusoy.workers.dev/api/quotes?refresh=1&verify="+str(time.time_ns())
          ]
          actual=None
          last_error=None
          for url in urls:
              try:
                  req=urllib.request.Request(url, headers={"Cache-Control":"no-cache","Pragma":"no-cache","User-Agent":"Bakiye-Quote-Verification/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status != 200:
                          raise RuntimeError("unexpected HTTP "+str(response.status))
                      candidate=json.load(response)
                  if not isinstance(candidate.get("quotes"), dict):
                      raise RuntimeError("quotes object missing")
                  actual=candidate
                  break
              except Exception as exc:
                  last_error=exc
          if actual is None:
              raise SystemExit("Public Worker quote API failed: "+str(last_error))
          assert actual.get("lastRefresh")==expected.get("lastRefresh"), (actual.get("lastRefresh"),expected.get("lastRefresh"))
          for symbol, value in expected["quotes"].items():
              assert float(actual["quotes"][symbol])==float(value), (symbol,actual["quotes"].get(symbol),value)
          for symbol, value in expected.get("fx", {}).items():
              assert float(actual["fx"][symbol])==float(value), (symbol,actual["fx"].get(symbol),value)
          print("Worker API lastRefresh:", actual["lastRefresh"])
          print("Worker API quotes:", actual["quotes"])
          print("Worker API FX:", actual["fx"])
          print("Worker API and R2 match: OK")
          PY
      - name: Publish quote pipeline status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="Bakiye / live quotes" \
            -f description="R2 + public Worker API verification: $JOB_STATUS" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/workflows/cloudflare.yml"
