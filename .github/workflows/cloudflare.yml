name: Deploy Bakiye to Cloudflare
on:
  push:
    branches: [main]
    paths: ["index.html","data/**","worker/**","wrangler.jsonc",".github/workflows/cloudflare.yml","scripts/**"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: bakiye-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Create R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest r2 bucket create bakiye-data || true
      - name: Seed data if R2 is empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/quotes.json >/dev/null 2>&1 || npx wrangler@latest r2 object put bakiye-data/quotes.json --file=data/quotes.json --content-type=application/json
          npx wrangler@latest r2 object get bakiye-data/tlref.json --file=/tmp/tlref.json >/dev/null 2>&1 || npx wrangler@latest r2 object put bakiye-data/tlref.json --file=data/tlref.json --content-type=application/json
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy

  refresh-quotes:
    needs: deploy
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Read current quotes from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/quotes.json || cp data/quotes.json /tmp/quotes.json
      - name: Fetch fresh Uzmanpara prices
        run: python3 scripts/refresh_quotes.py
      - name: Write fresh quotes to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/quotes.json --file=/tmp/quotes.json --content-type=application/json
      - name: Verify fresh quotes in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/verify-quotes.json
          python3 - <<'PY'
          import json
          q=json.load(open("/tmp/verify-quotes.json"))
          print("R2 lastRefresh:", q.get("lastRefresh"))
          print("R2 quotes:", q.get("quotes"))
          print("R2 errors:", q.get("errors"))
          assert not q.get("errors"), q.get("errors")
          assert all(isinstance(q.get("quotes", {}).get(k), (int, float)) and q["quotes"][k] > 0 for k in ["TAVHL","KARSN","THYAO","CGCAM","SISE","ZPLIB.F"])
          from datetime import datetime, timezone, timedelta
          refreshed=datetime.fromisoformat(q["lastRefresh"].replace("Z","+00:00"))
          assert datetime.now(timezone.utc)-refreshed < timedelta(minutes=3), "R2 quote data is not fresh"
          PY
      - name: Verify public Worker quote API
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          with open("/tmp/verify-quotes.json", encoding="utf-8") as f:
              expected=json.load(f)
          url="https://bakiye.muhsin-ulusoy.workers.dev/api/quotes?verify="+str(time.time_ns())
          req=urllib.request.Request(url, headers={"Cache-Control":"no-cache","Pragma":"no-cache","User-Agent":"Bakiye-Quote-Verification/1.0"})
          with urllib.request.urlopen(req, timeout=20) as response:
              actual=json.load(response)
          assert actual.get("lastRefresh")==expected.get("lastRefresh"), (actual.get("lastRefresh"),expected.get("lastRefresh"))
          for symbol, value in expected["quotes"].items():
              assert float(actual["quotes"][symbol])==float(value), (symbol,actual["quotes"].get(symbol),value)
          print("Worker API lastRefresh:", actual["lastRefresh"])
          print("Worker API quotes:", actual["quotes"])
          print("Worker API and R2 match: OK")
          PY
