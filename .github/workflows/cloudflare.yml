name: Deploy Bakiye to Cloudflare
on:
  push:
    branches: [main]
    paths: ["index.html","data/**","worker/**","wrangler.jsonc",".github/workflows/cloudflare.yml","scripts/**"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bakiye-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Create R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest r2 bucket create bakiye-data || true
      - name: Seed data if R2 is empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/quotes.json >/dev/null 2>&1 || npx wrangler@latest r2 object put bakiye-data/quotes.json --file=data/quotes.json --content-type=application/json
          npx wrangler@latest r2 object get bakiye-data/tlref.json --file=/tmp/tlref.json >/dev/null 2>&1 || npx wrangler@latest r2 object put bakiye-data/tlref.json --file=data/tlref.json --content-type=application/json
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy

  refresh-quotes:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Read current quotes from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/quotes.json || cp data/quotes.json /tmp/quotes.json
      - name: Fetch fresh Uzmanpara prices
        run: python3 scripts/refresh_quotes.py
      - name: Write fresh quotes to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/quotes.json --file=/tmp/quotes.json --content-type=application/json
