name: Refresh Bakiye Quotes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-bakiye-quotes
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Cloudflare Worker quotes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 \
            "https://bakiye.muhsin-ulusoy.workers.dev/api/quotes?refresh=1" \
            -o /tmp/quotes.json
          python3 - <<'PY'
          import json
          with open("/tmp/quotes.json", encoding="utf-8") as f:
              q=json.load(f)
          print("source:", q.get("source"))
          print("lastRefresh:", q.get("lastRefresh"))
          print("CGCAM:", q.get("quotes", {}).get("CGCAM"))
          print("missing:", q.get("missing"))
          print("errors:", q.get("errors"))
          if q.get("errors"):
              raise SystemExit("Quote source returned errors")
          if q.get("quotes", {}).get("CGCAM") is None:
              raise SystemExit("CGCAM quote missing")
          PY
