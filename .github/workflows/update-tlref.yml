name: Update TLREF Benchmark

on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch latest TLREF
        run: python scripts/update_tlref.py
      - name: Calculate daily real costs
        run: python scripts/update_real_cost.py
      - name: Publish TLREF and real costs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/tlref.json --file=data/tlref.json --content-type=application/json --remote
          npx wrangler@latest r2 object put bakiye-data/positions.json --file=data/positions.json --content-type=application/json --remote
      - name: Commit TLREF and daily real costs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tlref.json data/positions.json
          git diff --cached --quiet || git commit -m "Update daily TLREF and real costs"
          git push
