name: Update TLREF Benchmark

on:
  schedule:
    - cron: "15 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch latest TLREF
        run: python scripts/update_tlref.py
      - name: Commit TLREF benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tlref.json
          git diff --cached --quiet || git commit -m "Update TLREF benchmark"
          git push
