name: Update Real Cost

concurrency:
  group: bakiye-real-cost
  cancel-in-progress: false

on:
  schedule:
    - cron: "45 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh TLREF
        run: python scripts/update_tlref.py
      - name: Calculate daily real costs
        run: python scripts/update_real_cost.py
      - name: Commit daily real cost
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tlref.json data/positions.json
          git diff --cached --quiet || git commit -m "Update daily TLREF real costs"
          git push
