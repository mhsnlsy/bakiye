name: Archive daily closing stock prices

on:
  schedule:
    - cron: "40 15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: bakiye-stock-closing-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download current quotes from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/quotes.json --file=/tmp/quotes.json --remote
      - name: Build 30-day closing archive
        run: python3 scripts/archive_closing_prices.py
      - name: Download balance, positions and TLREF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/balance.json --file=/tmp/balance.json --remote
          npx wrangler@latest r2 object get bakiye-data/positions.json --file=/tmp/positions.json --remote
          npx wrangler@latest r2 object get bakiye-data/tlref.json --file=/tmp/tlref.json --remote
          npx wrangler@latest r2 object get bakiye-data/history.json --file=/tmp/history.json --remote || echo '{"version":1,"frequency":"daily","startDate":null,"retentionDays":365,"updatedAt":null,"snapshots":[]}' > /tmp/history.json
      - name: Build 18:40 asset snapshot
        run: python3 scripts/snapshot_history.py
      - name: Publish 18:40 asset snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/history.json --file=/tmp/history.json --content-type=application/json --remote
      - name: Publish 30-day archive to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object put bakiye-data/history/stock-closing.json --file=/tmp/stock-closing-history.json --content-type=application/json --remote
      - name: Verify archive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest r2 object get bakiye-data/history/stock-closing.json --file=/tmp/verify-stock-closing.json --remote
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/verify-stock-closing.json", encoding="utf-8"))
          entries=x.get("entries",[])
          assert len(entries) <= 30
          assert entries
          assert all(set(e.get("prices",{})) >= {"TAVHL","KARSN","THYAO","CGCAM","SISE","ZPLIB.F"} for e in entries)
          print("Archive entries:", len(entries))
          print("Latest:", entries[-1])
          PY
