name: Record Daily Balance History

on:
  schedule:
    - cron: "40,45,50 18 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-balance-history
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Record daily 18:40 snapshot with retries
        run: |
          for attempt in $(seq 1 10); do
            echo "Snapshot attempt $attempt/10"
            if python scripts/update_balance_history.py; then
              exit 0
            fi
            echo "Snapshot attempt failed; retrying in 60 seconds..."
            sleep 60
          done
          echo "ERROR: 18:40 snapshot could not be created after 10 attempts."
          exit 1

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Record daily balance snapshot"
          git push
