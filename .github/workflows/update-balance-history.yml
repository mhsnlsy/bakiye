name: Record Daily Balance History

on:
  push:
    branches: [main]
  schedule:
    # 18:40 is the target. Repeated 5-minute triggers make the daily
    # snapshot resilient to a delayed/missed GitHub scheduler event.
    - cron: "35,40,45,50,55 18 * * *"
      timezone: "Europe/Istanbul"
    - cron: "0,5,10,15,20,25,30 19 * * *"
      timezone: "Europe/Istanbul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-balance-history
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Record daily 18:40 snapshot
        env:
          FORCE_SNAPSHOT: "1"
        run: python scripts/update_balance_history.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Record daily balance snapshot"
          git push
